releaseNotes: "## Typescript SDK Changes:\n* `supermemory.connections.deleteByProvider()`:  `response` **Changed** (Breaking ⚠️)\n* `supermemory.profile()`:  `response.searchResults.results[]` **Changed** (Breaking ⚠️)\n* `supermemory.search()`:  `response.results[]` **Changed** (Breaking ⚠️)\n* `supermemory.connections.listDocuments()`:  `response.[].id` **Changed** (Breaking ⚠️)\n* `supermemory.connections.deleteById()`:  `response` **Changed** (Breaking ⚠️)\n* `supermemory.documents.search()`:  `response.results[].chunks[].position` **Added**\n* `supermemory.add()`: \n  *  `request.documentDate` **Added**\n* `supermemory.containerTags.mergeStatus()`:  `response` **Changed**\n* `supermemory.conversations.add()`: \n  *  `response.status[200]` **Added**\n  *  `error` **Changed**\n* `supermemory.connections.create()`:  `response` **Changed**\n* `supermemory.documents.listProcessing()`: \n  *  `request` **Added**\n  *  `response` **Changed**\n  *  `error.status[400]` **Added**\n* `supermemory.documents.update()`: \n  *  `request.body.documentDate` **Added**\n* `supermemory.documents.batchAdd()`: \n  *  `request` **Changed**\n  *  `response.results[].url` **Added**\n"
