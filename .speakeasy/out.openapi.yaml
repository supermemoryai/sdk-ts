  /v3/container-tags/merge:
    post:
      operationId: "postV3ContainerTagsMerge"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "containerTags"
                - "targetContainerTag"
              properties:
                containerTags:
                  type: "array"
                  items:
                    type: "string"
                  description: "List of container tags to merge (min: 2, max: 2). All documents from these tags will be merged into the target."
                targetContainerTag:
                  type: "string"
              additionalProperties: false
      description: "Merge multiple container tags into a target tag. All documents from the source tags will be updated to reference the target tag, and the source tags will be deleted after successful merge."
      responses:
        "202":
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "success"
                  - "status"
                  - "mergeId"
                  - "targetTag"
                  - "sourceTags"
                properties:
                  success:
                    type: "boolean"
                    description: "Whether the merge job was queued successfully."
                  status:
                    type: "string"
                    enum:
                      - "queued"
                    description: "The queued status of the merge job."
                  mergeId:
                    type: "string"
                    description: "Identifier for the queued merge job."
                  targetTag:
                    type: "string"
                    description: "The target container tag that documents will be merged into."
                  sourceTags:
                    type: "array"
                    items:
                      type: "string"
                    description: "List of source container tags queued for merge."
                additionalProperties: false
          description: "Merge queued successfully"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Bad request (e.g., invalid parameters)"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Forbidden - Only organization admins and owners can merge container tags"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "One or more container tags not found"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Internal server error"
      summary: "Merge container tags"
      tags:
        - "Container Tags"
      x-codeSamples:
        - lang: "bash"
          label: "cURL"
          source: "curl -X POST \"https://api.supermemory.ai/v3/container-tags/merge\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{ \"from\": \"user_old\", \"to\": \"user_123\" }'"
      x-speakeasy-group: containerTags
      x-speakeasy-name-override: merge
  /v3/container-tags/merge/{mergeId}:
    get:
      operationId: "getV3ContainerTagsMergeByMergeId"
      description: "Get queued container tag merge status"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                  status:
                    type: "string"
                    enum:
                      - "queued"
                      - "waiting_for_ingest"
                      - "copying_vectors"
                      - "db_committing"
                      - "cleanup_pending"
                      - "completed"
                      - "failed"
                  sourceTags:
                    type: "array"
                    items:
                      type: "string"
                  targetTag:
                    type: "string"
                  progress:
                    anyOf:
                      - type: "object"
                        properties:
                          phase:
                            type: "string"
                            enum:
                              - "queued"
                              - "waiting_for_ingest"
                              - "copying_vectors"
                              - "db_committing"
                              - "cleanup_pending"
                              - "completed"
                              - "failed"
                          currentSourceTag:
                            type: "string"
                          currentKind:
                            type: "string"
                            enum:
                              - "chunk"
                              - "memory"
                          copiedRows:
                            type: "number"
                          completedSourceTags:
                            type: "array"
                            items:
                              type: "string"
                          inFlightItems:
                            type: "number"
                          attempt:
                            type: "number"
                      - type: "null"
                  lastError:
                    anyOf:
                      - type: "string"
                      - type: "null"
                required:
                  - "id"
                  - "status"
                  - "sourceTags"
                  - "targetTag"
                  - "progress"
                  - "lastError"
          description: "Merge job status"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Merge job not found"
      summary: "Get container tag merge status"
      tags:
        - "Container Tags"
      parameters:
        - schema:
            type: "string"
          in: "path"
          name: "mergeId"
          required: true
      x-codeSamples:
        - lang: "bash"
          label: "cURL"
          source: "curl \"https://api.supermemory.ai/v3/container-tags/merge/merge_abc\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\""
      x-speakeasy-group: containerTags
      x-speakeasy-name-override: mergeStatus
  /v4/memories:
    post:
      operationId: "postV4Memories"
      description: "Create memories directly, bypassing the document ingestion workflow. Generates embeddings and makes them immediately searchable."
      responses:
        "201":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  documentId:
                    anyOf:
                      - type: "string"
                      - type: "null"
                    description: "ID of the source document created"
