openapi: "3.1.0"
components:
  securitySchemes:
    bearerAuth:
      scheme: "bearer"
      type: "http"
      x-speakeasy-name-override: apiKey
  schemas:
    ErrorResponse:
      type: "object"
      properties:
        error:
          type: "string"
          description: "Error message"
          example: "Invalid request parameters"
        details:
          type: "string"
          description: "Additional error details"
          example: "Query must be at least 1 character long"
      required:
        - "error"
    FilterCondition:
      type: "object"
      properties:
        filterType:
          default: "metadata"
          type: "string"
          enum:
            - "metadata"
            - "numeric"
            - "array_contains"
            - "string_contains"
        key:
          type: "string"
        negate:
          anyOf:
            - type: "boolean"
            - type: "string"
              enum:
                - "true"
                - "false"
        ignoreCase:
          anyOf:
            - type: "boolean"
            - type: "string"
              enum:
                - "true"
                - "false"
        numericOperator:
          default: "="
          type: "string"
          enum:
            - ">"
            - "<"
            - ">="
            - "<="
            - "="
        value:
          type: "string"
      required:
        - "key"
        - "value"
      description: "A single filter condition based on metadata, numeric values, array contents, or string matching"
    LogicalExpression:
      description: "A single filter condition or a nested AND/OR expression. The API validates up to 5 levels of nesting."
      anyOf:
        - $ref: "#/components/schemas/FilterCondition"
        - type: "object"
          properties:
            OR:
              type: "array"
              items:
                $ref: "#/components/schemas/LogicalExpression"
              description: "OR: Array of conditions or nested expressions"
          required:
            - "OR"
        - type: "object"
          properties:
            AND:
              type: "array"
              items:
                $ref: "#/components/schemas/LogicalExpression"
              description: "AND: Array of conditions or nested expressions"
          required:
            - "AND"
    QueryFilter:
      description: "Root query object that must contain either an AND or OR array of filter expressions"
      anyOf:
        - type: "object"
          properties:
            OR:
              type: "array"
              items:
                $ref: "#/components/schemas/LogicalExpression"
              description: "Array of OR filter expressions"
          required:
            - "OR"
        - type: "object"
          properties:
            AND:
              type: "array"
              items:
                $ref: "#/components/schemas/LogicalExpression"
              description: "Array of AND filter expressions"
          required:
            - "AND"
info:
  title: "supermemory API"
  description: "The Memory API for the AI era. OpenAPI operations include x-codeSamples for the official TypeScript and Python SDKs (Mintlify-compatible)."
  version: "3.0.0"
security:
  - bearerAuth: []
servers:
  - description: "Production Server"
    url: "https://api.supermemory.ai"
tags:
  - name: "Ingest"
    description: "Ingest documents, files, URLs, conversations, and other content"
  - name: "Recall (Search)"
    description: "Semantic recall across your content — supports memories, hybrid, and documents modes"
  - name: "Profiles"
    description: "Entity profiles for users, participants, or any entity — includes profile search"
  - name: "Content Management"
    description: "List, get, update, and delete content and memories"
  - name: "Container Tags"
    description: "List and manage container tags (spaces) — settings, merge, and delete"
  - name: "Connections"
    description: "External service integrations"
  - name: "Settings"
    description: "Organization settings"
  - name: "Documents"
    description: "List, get, and search documents"
paths:
  /v3/documents:
    post:
      operationId: "postV3Documents"
      description: "Add a document with any content type (text, url, file, etc.) and metadata"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "id"
                  - "status"
                properties:
                  id:
                    type: "string"
                    description: "Unique identifier of the document"
                  status:
                    type: "string"
                    description: "Status of the document"
                additionalProperties: false
          description: "Document added successfully"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Internal server error"
      summary: "Add document"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - "content"
              properties:
                content:
                  type: "string"
                  description: "The content to extract and process into a document. This can be a URL to a website, a PDF, an image, or a video."
                containerTag:
                  type: "string"
                  description: "Optional tag this document should be containerized by. Max 100 characters, alphanumeric with hyphens, underscores, and dots only."
                containerTags:
                  type: "array"
                  items:
                    type: "string"
                  deprecated: true
                  x-hidden: true
                entityContext:
                  type: "string"
                  description: "Optional entity context for this container tag. Max 1500 characters. Used during document processing to guide memory extraction."
                  title: "maxLength(1500)"
                  maxLength: 1500
                customId:
                  type: "string"
                  description: "Optional custom ID of the document. Max 100 characters, alphanumeric with hyphens, underscores, and dots only."
                metadata:
                  type: "object"
                  required: []
                  properties: {}
                  additionalProperties:
                    anyOf:
                      - type: "string"
                      - type: "number"
                      - type: "boolean"
                      - type: "array"
                        items:
                          type: "string"
                  description: "Optional metadata for the document."
                taskType:
                  type: "string"
                  enum:
                    - "memory"
                    - "superrag"
                  description: "Task type: \"memory\" (default) for full context layer with SuperRAG built in, \"superrag\" for managed RAG as a service."
                filepath:
                  type: "string"
                  description: "Optional file path for the document. Used by supermemoryfs to store the full path of the file."
                filterByMetadata:
                  type: "object"
                  required: []
                  properties: {}
                  additionalProperties:
                    anyOf:
                      - type: "string"
                      - type: "number"
                      - type: "boolean"
                      - type: "array"
                        items:
                          type: "string"
                  description: "Optional metadata filter to apply when pulling related memories and profile during ingestion. Only memories matching these filters will be used as context."
                documentDate:
                  type: "string"
                  description: "When this document's content is from, as opposed to when it was uploaded. Accepts YYYY-MM-DD or a full ISO 8601 timestamp. Memory extraction resolves relative dates against this instead of the ingestion time, and documents in a batch are processed oldest-first so newer facts correctly supersede older ones. Set this whenever you backfill historical content."
                dreaming:
                  type: "string"
                  enum:
                    - "instant"
                    - "dynamic"
                  description: "Processing mode. \"dynamic\" (default) groups related documents together so memories form from coherent, logical units rather than one isolated entry at a time. \"instant\" processes each document on its own right away, and bills one extra operation per document."
              additionalProperties: false
      x-codeSamples:
        - lang: "typescript"
          label: "TypeScript SDK"
          source: "import Supermemory from \"supermemory\";\n\nconst client = new Supermemory({\n  apiKey: process.env.SUPERMEMORY_API_KEY,\n});\n\nconst doc = await client.add({\n  content: \"Sarah is being promoted to VP of Product.\",\n  containerTag: \"user_123\",\n  customId: \"chat_session_1\",\n  metadata: { type: \"conversation\" },\n  dreaming: \"instant\",\n});\n\nconsole.log(doc.id, doc.status); // queued → poll until done"
        - lang: "python"
          label: "Python SDK"
          source: "from supermemory import Supermemory\n\nclient = Supermemory()  # uses SUPERMEMORY_API_KEY\n\ndoc = client.add(\n    content=\"Sarah is being promoted to VP of Product.\",\n    container_tag=\"user_123\",\n    custom_id=\"chat_session_1\",\n    metadata={\"type\": \"conversation\"},\n    dreaming=\"instant\",\n)\nprint(doc.id, doc.status)"
        - lang: "bash"
          label: "cURL"
          source: "curl -X POST \"https://api.supermemory.ai/v3/documents\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"content\": \"Sarah is being promoted to VP of Product.\",\n    \"containerTag\": \"user_123\",\n    \"customId\": \"chat_session_1\",\n    \"metadata\": { \"type\": \"conversation\" },\n    \"dreaming\": \"instant\"\n  }'"
      x-speakeasy-name-override: add
  /v3/documents/batch:
    post:
      operationId: "postV3DocumentsBatch"
      description: "Add multiple documents in a single request. Each document can have any content type (text, url, file, etc.) and metadata"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "results"
                  - "failed"
                  - "success"
                properties:
                  results:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "id"
                        - "status"
                      properties:
                        id:
                          type: "string"
                          description: "Unique identifier of the document (empty string for failed items)"
                        status:
                          type: "string"
                          description: "Status of the document (e.g. 'done', 'queued', 'error')"
                        error:
                          type: "string"
                          description: "Error message when status is 'error'"
                        details:
                          type: "string"
                          description: "Additional error details when status is 'error'"
                        url:
                          type: "string"
                          description: "URL of the failed item, when it had one. Only present on failed items, where it may be the only way to tell which input the error belongs to (the id falls back to 'unknown' when the input had neither an id nor a customId)."
                      additionalProperties: false
                    description: "Array of results for each document in the batch"
                  failed:
                    type: "number"
                    description: "Count of documents that failed to add"
                  success:
                    type: "number"
                    description: "Count of documents successfully added"
                additionalProperties: false
          description: "Documents added successfully"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Document token limit reached"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Internal server error"
      summary: "Batch add documents"
      tags:
        - "Ingest"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                containerTag:
                  description: "Optional tag this document should be containerized by. This can be an ID for your user, a project ID, or any other identifier you wish to use to group documents."
                  example: "user_alex"
                  type: "string"
                  maxLength: 100
                  pattern: "^[a-zA-Z0-9_:-]+$"
                containerTags:
                  description: "(DEPRECATED: Use containerTag instead) Optional tags this document should be containerized by. This can be an ID for your user, a project ID, or any other identifier you wish to use to group documents."
                  deprecated: true
                  x-hidden: true
                  type: "array"
                  items:
                    type: "string"
                    maxLength: 100
                    pattern: "^[a-zA-Z0-9_:-]+$"
                metadata:
                  description: "Optional metadata for the document. This is used to store additional information about the document. You can use this to store any additional information you need about the document. Metadata can be filtered through. Keys must be strings and are case sensitive. Values can be strings, numbers, or booleans. You cannot nest objects."
                  example:
                    source: "upload"
                    language: "en"
                  type: "object"
                  propertyNames:
                    type: "string"
                  additionalProperties:
                    anyOf:
                      - type: "string"
                      - type: "number"
                      - type: "boolean"
                      - type: "array"
                        items:
                          type: "string"
                taskType:
                  description: "Task type: \"memory\" (default) for full context layer with SuperRAG built in, \"superrag\" for managed RAG as a service."
                  example: "memory"
                  type: "string"
                  enum:
                    - "memory"
                    - "superrag"
                filepath:
                  description: "Optional file path for the document (e.g., '/documents/reports/file.pdf'). Used by supermemoryfs to map documents to filesystem paths."
                  example: "/documents/reports/file.pdf"
                  x-hidden: true
                  type: "string"
                filterByMetadata:
                  description: "Optional metadata filter scoping which existing memories are pulled as context during ingestion. Scalar values match exactly (AND across keys); array values match ANY (OR within key). Only memories whose source documents match this filter are used as context."
                  example:
                    department: "engineering"
                    region: "us"
                  type: "object"
                  propertyNames:
                    type: "string"
                  additionalProperties:
                    anyOf:
                      - type: "string"
                      - type: "number"
                      - type: "boolean"
                      - type: "array"
                        items:
                          type: "string"
                documentDate:
                  description: "When this document's content is from, as opposed to when it was uploaded. Accepts YYYY-MM-DD or a full ISO 8601 timestamp. Memory extraction resolves relative dates ('yesterday', 'last quarter') against this instead of the ingestion time, and documents in a batch are processed oldest-first so newer facts correctly supersede older ones. Set this whenever you backfill historical content."
                  example: "2025-03-14"
                  type: "string"
                entityContext:
                  description: "Optional entity context for this container tag. Max 1500 characters. Used during document processing to guide memory extraction."
                  example: "User's name is {XYZ}"
                  type: "string"
                  maxLength: 1500
                dreaming:
                  description: "Processing mode. \"dynamic\" (default) groups related documents together so memories form from coherent, logical units rather than one isolated entry at a time. \"instant\" processes each document on its own right away, and bills one extra operation per document."
                  example: "instant"
                  type: "string"
                  enum:
                    - "instant"
                    - "dynamic"
                documents:
                  anyOf:
                    - minItems: 1
                      maxItems: 600
                      type: "array"
                      items:
                        type: "object"
                        properties:
                          containerTag:
                            description: "Optional tag this document should be containerized by. This can be an ID for your user, a project ID, or any other identifier you wish to use to group documents."
                            example: "user_alex"
                            type: "string"
                            maxLength: 100
                            pattern: "^[a-zA-Z0-9_:-]+$"
                          containerTags:
                            description: "(DEPRECATED: Use containerTag instead) Optional tags this document should be containerized by. This can be an ID for your user, a project ID, or any other identifier you wish to use to group documents."
                            deprecated: true
                            x-hidden: true
                            type: "array"
                            items:
                              type: "string"
                              maxLength: 100
                              pattern: "^[a-zA-Z0-9_:-]+$"
                          content:
                            type: "string"
                            description: "The content to extract and process into a document. This can be a URL to a website, a PDF, an image, or a video. \n\nPlaintext: Any plaintext format\n\nURL: A URL to a website, PDF, image, or video\n\nWe automatically detect the content type from the url's response format."
                            example: "Our API rate limits are 100 req/min on free and 1000 on pro. Clients should use exponential backoff on 429s."
                          customId:
                            description: "Optional custom ID of the document. This could be an ID from your database that will uniquely identify this document."
                            example: "doc-api-rate-limits"
                            type: "string"
                          metadata:
                            description: "Optional metadata for the document. This is used to store additional information about the document. You can use this to store any additional information you need about the document. Metadata can be filtered through. Keys must be strings and are case sensitive. Values can be strings, numbers, or booleans. You cannot nest objects."
                            example:
                              source: "upload"
                              language: "en"
                            type: "object"
                            propertyNames:
                              type: "string"
                            additionalProperties:
                              anyOf:
                                - type: "string"
                                - type: "number"
                                - type: "boolean"
                                - type: "array"
                                  items:
                                    type: "string"
                          taskType:
                            description: "Task type: \"memory\" (default) for full context layer with SuperRAG built in, \"superrag\" for managed RAG as a service."
                            example: "memory"
                            type: "string"
                            enum:
                              - "memory"
                              - "superrag"
                          filepath:
                            description: "Optional file path for the document (e.g., '/documents/reports/file.pdf'). Used by supermemoryfs to map documents to filesystem paths."
                            example: "/documents/reports/file.pdf"
                            x-hidden: true
                            type: "string"
                          filterByMetadata:
                            description: "Optional metadata filter scoping which existing memories are pulled as context during ingestion. Scalar values match exactly (AND across keys); array values match ANY (OR within key). Only memories whose source documents match this filter are used as context."
                            example:
                              department: "engineering"
                              region: "us"
                            type: "object"
                            propertyNames:
                              type: "string"
                            additionalProperties:
                              anyOf:
                                - type: "string"
                                - type: "number"
                                - type: "boolean"
                                - type: "array"
                                  items:
                                    type: "string"
                          documentDate:
                            description: "When this document's content is from, as opposed to when it was uploaded. Accepts YYYY-MM-DD or a full ISO 8601 timestamp. Memory extraction resolves relative dates ('yesterday', 'last quarter') against this instead of the ingestion time, and documents in a batch are processed oldest-first so newer facts correctly supersede older ones. Set this whenever you backfill historical content."
                            example: "2025-03-14"
                            type: "string"
                          entityContext:
                            description: "Optional entity context for this container tag. Max 1500 characters. Used during document processing to guide memory extraction."
                            example: "User's name is {XYZ}"
                            type: "string"
                            maxLength: 1500
                          dreaming:
                            description: "Processing mode. \"dynamic\" (default) groups related documents together so memories form from coherent, logical units rather than one isolated entry at a time. \"instant\" processes each document on its own right away, and bills one extra operation per document."
                            example: "instant"
                            type: "string"
                            enum:
                              - "instant"
                              - "dynamic"
                        required:
                          - "content"
                    - minItems: 1
                      maxItems: 600
                      type: "array"
                      items:
                        type: "string"
                        description: "The content to extract and process into a document. This can be a URL to a website, a PDF, an image, or a video. \n\nPlaintext: Any plaintext format\n\nURL: A URL to a website, PDF, image, or video\n\nWe automatically detect the content type from the url's response format."
                        example: "Our API rate limits are 100 req/min on free and 1000 on pro. Clients should use exponential backoff on 429s."
                content:
                  type: "null"
              required:
                - "documents"
      x-codeSamples:
        - lang: "typescript"
          label: "TypeScript SDK"
          source: "import Supermemory from \"supermemory\";\n\nconst client = new Supermemory({\n  apiKey: process.env.SUPERMEMORY_API_KEY,\n});\n\nconst res = await client.documents.batchAdd({\n  documents: [\n    {\n      content: \"Q3 roadmap notes\",\n      containerTag: \"user_123\",\n      customId: \"doc_roadmap\",\n    },\n    {\n      content: \"Gift policy for VP promotions\",\n      containerTag: \"user_123\",\n      customId: \"doc_gifts\",\n    },\n  ],\n});\nconsole.log(res);"
        - lang: "python"
          label: "Python SDK"
          source: "from supermemory import Supermemory\n\nclient = Supermemory()  # uses SUPERMEMORY_API_KEY\n\nres = client.documents.batch_add(\n    documents=[\n        {\n            \"content\": \"Q3 roadmap notes\",\n            \"container_tag\": \"user_123\",\n            \"custom_id\": \"doc_roadmap\",\n        },\n        {\n            \"content\": \"Gift policy for VP promotions\",\n            \"container_tag\": \"user_123\",\n            \"custom_id\": \"doc_gifts\",\n        },\n    ],\n)\nprint(res)"
        - lang: "bash"
          label: "cURL"
          source: "curl -X POST \"https://api.supermemory.ai/v3/documents/batch\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"documents\": [\n      {\n        \"content\": \"Q3 roadmap notes\",\n        \"containerTag\": \"user_123\",\n        \"customId\": \"doc_roadmap\"\n      }\n    ]\n  }'"
      x-speakeasy-name-override: batchAdd
      x-speakeasy-group: documents
  /v3/documents/{id}:
    patch:
      operationId: "patchV3DocumentsById"
      parameters:
        - in: "path"
          name: "id"
          schema:
            type: "string"
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                containerTag:
                  description: "Optional tag this document should be containerized by. This can be an ID for your user, a project ID, or any other identifier you wish to use to group documents."
                  example: "user_alex"
                  type: "string"
                  maxLength: 100
                  pattern: "^[a-zA-Z0-9_:-]+$"
                containerTags:
                  description: "(DEPRECATED: Use containerTag instead) Optional tags this document should be containerized by. This can be an ID for your user, a project ID, or any other identifier you wish to use to group documents."
                  deprecated: true
                  x-hidden: true
                  type: "array"
                  items:
                    type: "string"
                    maxLength: 100
                    pattern: "^[a-zA-Z0-9_:-]+$"
                content:
                  type: "string"
                  description: "The content to extract and process into a document. This can be a URL to a website, a PDF, an image, or a video. \n\nPlaintext: Any plaintext format\n\nURL: A URL to a website, PDF, image, or video\n\nWe automatically detect the content type from the url's response format."
                  example: "Our API rate limits are 100 req/min on free and 1000 on pro. Clients should use exponential backoff on 429s."
                customId:
                  description: "Optional custom ID of the document. This could be an ID from your database that will uniquely identify this document."
                  example: "doc-api-rate-limits"
                  type: "string"
                metadata:
                  description: "Optional metadata for the document. This is used to store additional information about the document. You can use this to store any additional information you need about the document. Metadata can be filtered through. Keys must be strings and are case sensitive. Values can be strings, numbers, or booleans. You cannot nest objects."
                  example:
                    source: "upload"
                    language: "en"
                  type: "object"
                  propertyNames:
                    type: "string"
                  additionalProperties:
                    anyOf:
                      - type: "string"
                      - type: "number"
                      - type: "boolean"
                      - type: "array"
                        items:
                          type: "string"
                taskType:
                  description: "Task type: \"memory\" (default) for full context layer with SuperRAG built in, \"superrag\" for managed RAG as a service."
                  example: "memory"
                  type: "string"
                  enum:
                    - "memory"
                    - "superrag"
                filepath:
                  description: "Optional file path for the document (e.g., '/documents/reports/file.pdf'). Used by supermemoryfs to map documents to filesystem paths."
                  example: "/documents/reports/file.pdf"
                  x-hidden: true
                  type: "string"
                filterByMetadata:
                  description: "Optional metadata filter scoping which existing memories are pulled as context during ingestion. Scalar values match exactly (AND across keys); array values match ANY (OR within key). Only memories whose source documents match this filter are used as context."
                  example:
                    department: "engineering"
                    region: "us"
                  type: "object"
                  propertyNames:
                    type: "string"
                  additionalProperties:
                    anyOf:
                      - type: "string"
                      - type: "number"
                      - type: "boolean"
                      - type: "array"
                        items:
                          type: "string"
                documentDate:
                  description: "When this document's content is from, as opposed to when it was uploaded. Accepts YYYY-MM-DD or a full ISO 8601 timestamp. Memory extraction resolves relative dates ('yesterday', 'last quarter') against this instead of the ingestion time, and documents in a batch are processed oldest-first so newer facts correctly supersede older ones. Set this whenever you backfill historical content."
                  example: "2025-03-14"
                  type: "string"
      description: "Update a document with any content type (text, url, file, etc.) and metadata"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "id"
                  - "status"
                properties:
                  id:
                    type: "string"
                    description: "Unique identifier of the document"
                  status:
                    type: "string"
                    description: "Status of the document"
                additionalProperties: false
          description: "Document updated successfully"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Document not found"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Internal server error"
      summary: "Update document"
      tags:
        - "Ingest"
      x-codeSamples:
        - lang: "typescript"
          label: "TypeScript SDK"
          source: "import Supermemory from \"supermemory\";\n\nconst client = new Supermemory({\n  apiKey: process.env.SUPERMEMORY_API_KEY,\n});\n\nconst updated = await client.documents.update(\"doc_abc123\", {\n  content: \"Updated notes — Sarah is now VP of Product.\",\n  metadata: { type: \"conversation\" },\n});\nconsole.log(updated.id, updated.status);"
        - lang: "python"
          label: "Python SDK"
          source: "from supermemory import Supermemory\n\nclient = Supermemory()  # uses SUPERMEMORY_API_KEY\n\nupdated = client.documents.update(\n    \"doc_abc123\",\n    content=\"Updated notes — Sarah is now VP of Product.\",\n)\nprint(updated.id, updated.status)"
