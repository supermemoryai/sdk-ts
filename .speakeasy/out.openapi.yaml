openapi: "3.1.0"
components:
  securitySchemes:
    bearerAuth:
      scheme: "bearer"
      type: "http"
      x-speakeasy-name-override: apiKey
  schemas:
    ErrorResponse:
      type: "object"
      properties:
        error:
          type: "string"
          description: "Error message"
          example: "Invalid request parameters"
        details:
          type: "string"
          description: "Additional error details"
          example: "Query must be at least 1 character long"
      required:
        - "error"
    FilterPredicate:
      anyOf:
        - type: "object"
          properties:
            field:
              type: "string"
              minLength: 1
              pattern: "^[a-zA-Z0-9_.-]+$"
              description: "Metadata key to evaluate, matched literally. A period is part of the key name, not a path into nested metadata."
            operator:
              type: "string"
              enum:
                - "eq"
                - "neq"
              description: "Compare the field for equality or inequality"
            value:
              type: "string"
              description: "String value to compare against"
            caseSensitive:
              default: true
              description: "Whether string comparison preserves letter case"
              type: "boolean"
          required:
            - "field"
            - "operator"
            - "value"
          additionalProperties: false
        - type: "object"
          properties:
            field:
              type: "string"
              minLength: 1
              pattern: "^[a-zA-Z0-9_.-]+$"
              description: "Metadata key to evaluate, matched literally. A period is part of the key name, not a path into nested metadata."
            operator:
              type: "string"
              enum:
                - "eq"
                - "neq"
              description: "Compare the field for equality or inequality"
            value:
              anyOf:
                - type: "number"
                - type: "boolean"
              description: "Numeric or boolean value to compare against"
          required:
            - "field"
            - "operator"
            - "value"
          additionalProperties: false
        - type: "object"
          properties:
            field:
              type: "string"
              minLength: 1
              pattern: "^[a-zA-Z0-9_.-]+$"
              description: "Metadata key to evaluate, matched literally. A period is part of the key name, not a path into nested metadata."
            operator:
              type: "string"
              enum:
                - "gt"
                - "gte"
                - "lt"
                - "lte"
              description: "Numeric comparison to apply"
            value:
              type: "number"
              description: "Numeric value to compare against"
          required:
            - "field"
            - "operator"
            - "value"
          additionalProperties: false
        - type: "object"
          properties:
            field:
              type: "string"
              minLength: 1
              pattern: "^[a-zA-Z0-9_.-]+$"
              description: "Metadata key to evaluate, matched literally. A period is part of the key name, not a path into nested metadata."
            operator:
              type: "string"
              enum:
                - "contains"
                - "notContains"
              description: "Require or exclude a substring match"
            value:
              type: "string"
              description: "Substring to look for"
            caseSensitive:
              default: true
              description: "Whether substring matching preserves letter case"
              type: "boolean"
          required:
            - "field"
            - "operator"
            - "value"
          additionalProperties: false
        - type: "object"
          properties:
            field:
              type: "string"
              minLength: 1
              pattern: "^[a-zA-Z0-9_.-]+$"
              description: "Metadata key to evaluate, matched literally. A period is part of the key name, not a path into nested metadata."
            operator:
              type: "string"
              enum:
                - "arrayContains"
                - "arrayNotContains"
              description: "Require or exclude an exact array member"
            value:
              type: "string"
              description: "Array member to look for"
          required:
            - "field"
            - "operator"
            - "value"
          additionalProperties: false
    FilterExpression:
      description: "A type-safe metadata filter predicate or nested and/or expression. The API validates up to 5 levels of nesting."
      anyOf:
        - $ref: "#/components/schemas/FilterPredicate"
        - type: "object"
          properties:
            operator:
              type: "string"
              const: "and"
              description: "Require every nested filter expression to match"
            operands:
              type: "array"
              minItems: 1
              maxItems: 200
              items:
                $ref: "#/components/schemas/FilterExpression"
              description: "Filter expressions combined with logical AND"
          required:
            - "operator"
            - "operands"
          additionalProperties: false
        - type: "object"
          properties:
            operator:
              type: "string"
              const: "or"
              description: "Require at least one nested filter expression to match"
            operands:
              type: "array"
              minItems: 1
              maxItems: 200
              items:
                $ref: "#/components/schemas/FilterExpression"
              description: "Filter expressions combined with logical OR"
          required:
            - "operator"
            - "operands"
          additionalProperties: false
    ValidationErrorResponse:
      type: "object"
      description: "Body returned when request input fails schema validation"
      properties:
        success:
          type: "boolean"
          enum:
            - false
        error:
          type: "array"
          description: "Validation issues"
          items:
            type: "object"
            properties:
              message:
                type: "string"
              path:
                type: "array"
                items:
                  oneOf:
                    - type: "string"
                    - type: "number"
            required:
              - "message"
        data:
          description: "The input that failed validation"
      required:
        - "success"
        - "error"
info:
  title: "supermemory API"
  description: "The Memory API for the AI era. OpenAPI operations include x-codeSamples for the official TypeScript and Python SDKs (Mintlify-compatible)."
  version: "5.0.0"
security:
  - bearerAuth: []
servers:
  - description: "Production Server"
    url: "https://api.supermemory.ai"
tags:
  - name: "Ingest"
    description: "Ingest documents, files, URLs, conversations, and other content"
  - name: "Recall (Search)"
    description: "Semantic recall across your content — supports memories, hybrid, and documents modes"
  - name: "Profiles"
    description: "Maintained static, dynamic, and custom-bucket profiles scoped by namespace"
  - name: "Content Management"
    description: "List, get, update, and delete content and memories"
  - name: "Namespaces"
    description: "List and manage isolated namespaces and their settings"
  - name: "Organization"
    description: "Read and update organization-wide settings"
paths:
  /ns/{namespace}/document:
    post:
      operationId: "postNsByNamespaceDocument"
      description: "Turn text or a supported URL into searchable, evolving memory. Supply a new ID to create a document, or reuse an existing ID to append new information while preserving its history."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "id"
                  - "status"
                properties:
                  id:
                    type: "string"
                    description: "Unique identifier of the document"
                  status:
                    type: "string"
                    description: "Status of the document"
                additionalProperties: false
          description: "Document accepted for processing"
        "400":
          description: "Invalid request parameters"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Insufficient processing credits"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Namespace write access denied"
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Namespace merge or filepath conflict"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server error"
      summary: "Add document"
      parameters:
        - in: "path"
          name: "namespace"
          schema:
            type: "string"
            maxLength: 100
            pattern: "^[a-zA-Z0-9_:-]+$"
            example: "user_alex"
          required: true
          description: "The isolated namespace. This can be an ID for your user, a project ID, or any other identifier you wish to use to scope documents."
        - in: "query"
          name: "taskType"
          schema:
            type: "string"
            enum:
              - "memory"
              - "superrag"
          description: "Processing pipeline. \"memory\" builds durable learned context; \"superrag\" optimizes the document for retrieval without generating memories."
        - in: "query"
          name: "dreaming"
          schema:
            type: "string"
            enum:
              - "dynamic"
              - "instant"
          description: "Processing mode. \"dynamic\" (default) groups related documents so memories form from coherent context. \"instant\" processes each document independently right away and bills one extra operation per document."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                content:
                  type: "string"
                  description: "The content to process. This may be plaintext or a URL to supported rich content."
                  example: "Supermemory turns unstructured content into evolving memory."
                id:
                  description: "An optional caller-defined document ID"
                  type: "string"
                  minLength: 1
                  maxLength: 255
                  example: "my-doc-123"
                supportingContext:
                  description: "Context used to guide memory extraction within this namespace. Max 1500 characters."
                  example: "Focus on product decisions, dates, and owners."
                  type: "string"
                  maxLength: 1500
                metadata:
                  description: "Arbitrary metadata attached to the document and derived data"
                  example:
                    source: "api-docs"
                  type: "object"
                  propertyNames:
                    type: "string"
                  additionalProperties:
                    anyOf:
                      - type: "string"
                      - type: "number"
                      - type: "boolean"
                      - type: "array"
                        items:
                          type: "string"
                group:
                  description: "Metadata values that isolate related context within the namespace"
                  type: "object"
                  propertyNames:
                    type: "string"
                  additionalProperties:
                    anyOf:
                      - type: "string"
                      - type: "number"
                      - type: "boolean"
                      - type: "array"
                        items:
                          type: "string"
                date:
                  description: "When the source content is from, in ISO 8601 format"
                  example: "2026-01-15"
                  type: "string"
              required:
                - "content"
              additionalProperties: false
      x-codeSamples:
        - lang: "bash"
          label: "cURL"
          source: "curl -X POST \"https://api.supermemory.ai/ns/user_123/document?dreaming=instant\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"content\": \"Sarah is being promoted to VP of Product.\",\n    \"id\": \"chat_session_1\",\n    \"metadata\": { \"type\": \"conversation\" }\n  }'"
      x-speakeasy-name-override: add
    delete:
      operationId: "deleteNsByNamespaceDocument"
      description: "Permanently remove documents and their derived knowledge by document ID or caller-defined ID. Each requested ID is handled independently so successful deletions are preserved when another ID fails."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  deletedCount:
                    type: "integer"
                    minimum: 0
                    maximum: 9007199254740991
                    description: "Number of documents successfully deleted"
                  errors:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          minLength: 1
                          maxLength: 255
                          example: "my-doc-123"
                          description: "The requested document identifier"
                        error:
                          type: "string"
                          minLength: 1
                          description: "Why this document could not be deleted"
                      required:
                        - "id"
                        - "error"
                      additionalProperties: false
                    description: "Per-document failures; successful deletions are not rolled back"
                required:
                  - "deletedCount"
                  - "errors"
                additionalProperties: false
          description: "Document deletion completed"
        "400":
          description: "Invalid delete request"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Write access required for this namespace"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Internal server error"
      summary: "Delete documents"
      tags:
        - "Content Management"
      parameters:
        - in: "path"
          name: "namespace"
          schema:
            type: "string"
            maxLength: 100
            pattern: "^[a-zA-Z0-9_:-]+$"
            example: "user_alex"
          required: true
          description: "The isolated namespace. This can be an ID for your user, a project ID, or any other identifier you wish to use to scope documents."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                ids:
                  minItems: 1
                  maxItems: 100
                  type: "array"
                  items:
                    type: "string"
                    minLength: 1
                    maxLength: 255
                    example: "my-doc-123"
                    description: "A document ID or caller-defined ID"
                  description: "Document identifiers to permanently delete from this namespace"
                  example:
                    - "my-doc-123"
              required:
                - "ids"
              additionalProperties: false
      x-speakeasy-group: documents
      x-speakeasy-name-override: delete
  /ns/{namespace}/document/batch:
    post:
      operationId: "postNsByNamespaceDocumentBatch"
      description: "Build a knowledge base efficiently by ingesting up to 600 text or URL documents at once. Existing caller-defined IDs append new information using the same semantics as single-document ingestion."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                required:
                  - "results"
                  - "failed"
                  - "success"
                properties:
                  results:
                    type: "array"
                    items:
                      type: "object"
                      required:
                        - "id"
                        - "status"
                      properties:
                        id:
                          type: "string"
                          description: "Unique identifier of the document (empty string for failed items)"
                        status:
                          type: "string"
                          description: "Status of the document (e.g. 'done', 'queued', 'error')"
                        error:
                          type: "string"
                          description: "Error message when status is 'error'"
                        details:
                          type: "string"
                          description: "Additional error details when status is 'error'"
                        url:
                          type: "string"
                          description: "URL of the failed item, when it had one. Only present on failed items, where it may be the only way to tell which input the error belongs to (the id falls back to 'unknown' when the input had neither an id nor a customId)."
                      additionalProperties: false
                    description: "Array of results for each document in the batch"
                  failed:
                    type: "number"
                    description: "Count of documents that failed to add"
                  success:
                    type: "number"
                    description: "Count of documents successfully added"
                additionalProperties: false
          description: "Batch accepted for processing"
        "400":
          description: "Invalid request parameters"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Insufficient processing credits"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Namespace write access denied"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server error"
      summary: "Batch add documents"
      tags:
        - "Ingest"
      parameters:
        - in: "path"
          name: "namespace"
          schema:
            type: "string"
            maxLength: 100
            pattern: "^[a-zA-Z0-9_:-]+$"
            example: "user_alex"
          required: true
          description: "The isolated namespace. This can be an ID for your user, a project ID, or any other identifier you wish to use to scope documents."
        - in: "query"
          name: "taskType"
          schema:
            type: "string"
            enum:
              - "memory"
              - "superrag"
          description: "Processing pipeline. \"memory\" builds durable learned context; \"superrag\" optimizes the document for retrieval without generating memories."
        - in: "query"
          name: "dreaming"
          schema:
            type: "string"
            enum:
              - "dynamic"
              - "instant"
          description: "Processing mode. \"dynamic\" (default) groups related documents so memories form from coherent context. \"instant\" processes each document independently right away and bills one extra operation per document."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                documents:
                  minItems: 1
                  maxItems: 600
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      content:
                        type: "string"
                        description: "The content to process. This may be plaintext or a URL to supported rich content."
                        example: "Supermemory turns unstructured content into evolving memory."
                      id:
                        description: "An optional caller-defined document ID"
                        type: "string"
                        minLength: 1
                        maxLength: 255
                        example: "my-doc-123"
                      supportingContext:
                        description: "Context used to guide memory extraction within this namespace. Max 1500 characters."
                        example: "Focus on product decisions, dates, and owners."
                        type: "string"
                        maxLength: 1500
                      metadata:
                        description: "Arbitrary metadata attached to the document and derived data"
                        example:
                          source: "api-docs"
                        type: "object"
                        propertyNames:
                          type: "string"
                        additionalProperties:
                          anyOf:
                            - type: "string"
                            - type: "number"
                            - type: "boolean"
                            - type: "array"
                              items:
                                type: "string"
                      group:
                        description: "Metadata values that isolate related context within the namespace"
                        type: "object"
                        propertyNames:
                          type: "string"
                        additionalProperties:
                          anyOf:
                            - type: "string"
                            - type: "number"
                            - type: "boolean"
                            - type: "array"
                              items:
                                type: "string"
                      date:
                        description: "When the source content is from, in ISO 8601 format"
                        example: "2026-01-15"
                        type: "string"
                    required:
                      - "content"
                    additionalProperties: false
                  description: "Documents to ingest or append in one request"
              required:
                - "documents"
              additionalProperties: false
      x-codeSamples:
        - lang: "bash"
          label: "cURL"
          source: "curl -X POST \"https://api.supermemory.ai/ns/user_123/document/batch?dreaming=instant\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"documents\": [\n      { \"content\": \"Q3 roadmap notes\", \"id\": \"doc_roadmap\" },\n      { \"content\": \"Gift policy for VP promotions\", \"id\": \"doc_gifts\" }\n    ]\n  }'"
      x-speakeasy-group: documents
      x-speakeasy-name-override: batchAdd
  /ns/{namespace}/document/{id}:
    get:
      operationId: "getNsByNamespaceDocumentById"
      description: "Retrieve a document's canonical content, metadata, and processing state by document ID or caller-defined ID. Optionally attach its source chunks, derived memories, or both in the same response."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    description: "Stable document identifier"
                    example: "doc_xyz789"
                  title:
                    anyOf:
                      - type: "string"
                      - type: "null"
                    description: "Extracted or caller-provided document title"
                    example: "API Rate Limiting Policy"
                  type:
                    type: "string"
                    description: "Detected source or content type"
                    example: "text"
                  summary:
                    anyOf:
                      - type: "string"
                      - type: "null"
                    description: "Generated summary of the document, when available"
                  content:
                    anyOf:
                      - type: "string"
                      - type: "null"
                    description: "Canonical extracted text used for processing and recall"
                    example: "Our API rate limits are 100 req/min on free and 1000 on pro."
                  metadata:
                    type: "object"
                    propertyNames:
                      type: "string"
                    additionalProperties: {}
                    description: "Caller metadata with internal fields removed"
                    example:
                      source: "api-docs"
                  system:
                    type: "object"
                    properties:
                      status:
                        type: "string"
                        description: "Current extraction and memory-processing status"
                      createdAt:
                        type: "string"
                        format: "date-time"
                        pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
                        description: "ISO 8601 timestamp when the document was created"
                      updatedAt:
                        type: "string"
                        format: "date-time"
                        pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
                        description: "ISO 8601 timestamp of the latest document update"
                    required:
                      - "status"
                      - "createdAt"
                      - "updatedAt"
                    description: "Processing status, lifecycle timestamps, and storage path maintained by Supermemory"
                  chunks:
                    description: "Ordered document chunks; included only when requested"
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          description: "Stable chunk identifier"
                        position:
                          type: "integer"
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          description: "Zero-based order within the document"
                        content:
                          type: "string"
                          description: "Chunk text used for retrieval"
                        type:
                          type: "string"
                          description: "Chunk content type"
                        metadata:
                          anyOf:
                            - type: "object"
                              propertyNames:
                                type: "string"
                              additionalProperties: {}
                            - type: "null"
                          description: "Chunk metadata, when available"
                        system:
                          type: "object"
                          properties:
                            createdAt:
                              type: "string"
                              format: "date-time"
                              pattern: "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d(?::[0-5]\\d(?:\\.\\d+)?)?(?:Z))$"
                              description: "ISO 8601 timestamp when the chunk was created"
                          required:
                            - "createdAt"
                          description: "Lifecycle timestamps maintained by Supermemory"
                      required:
                        - "id"
                        - "position"
                        - "content"
                        - "type"
                        - "metadata"
                        - "system"
                      description: "A chunk of source content belonging to a document"
                  memories:
                    description: "Memories derived from the document; included only when requested"
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          description: "Stable memory identifier"
                        memory:
                          type: "string"
                          description: "Learned fact or context extracted from the document"
                        metadata:
                          anyOf:
                            - type: "object"
                              propertyNames:
                                type: "string"
                              additionalProperties: {}
                            - type: "null"
                          description: "Memory metadata, including temporal context when available"
                        isStatic:
                          type: "boolean"
                          description: "Whether the memory belongs to the stable profile section"
                        isInference:
                          type: "boolean"
                          description: "Whether the memory was inferred rather than explicitly stated"
                        isLatest:
                          type: "boolean"
                          description: "Whether this is the newest version in its memory chain"
                        isForgotten:
                          type: "boolean"
                          description: "Whether this memory has been excluded from normal recall"
                        version:
                          type: "integer"
                          minimum: -9007199254740991
                          maximum: 9007199254740991
