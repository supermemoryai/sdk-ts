          source: "from supermemory import Supermemory\n\nclient = Supermemory()  # uses SUPERMEMORY_API_KEY\n\nupdated = client.memories.update_memory(\n    id=\"mem_abc123\",\n    container_tag=\"user_123\",\n    new_content=\"John now prefers light mode\",\n)\nprint(updated)"
        - lang: "bash"
          label: "cURL"
          source: "curl -X PATCH \"https://api.supermemory.ai/v4/memories\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"id\": \"mem_abc123\",\n    \"containerTag\": \"user_123\",\n    \"newContent\": \"John now prefers light mode\"\n  }'"
      x-speakeasy-group: memories
      x-speakeasy-name-override: updateMemory
  /v4/memories/forget-matching:
    post:
      operationId: "postV4MemoriesForgetMatching"
      description: "Agentic mass-forget. Given a prompt or query, a tool-calling agent searches the container's memories and soft-deletes everything matching the target. Use dryRun to preview first."
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  dryRun:
                    type: "boolean"
                    description: "Whether this was a preview (no mutation) or a real forget"
                  count:
                    type: "number"
                    description: "Number of memories selected / forgotten"
                  forgetBatchId:
                    anyOf:
                      - type: "string"
                      - type: "null"
                    description: "ID tagged on every memory forgotten in this call (null on dryRun)"
                  summary:
                    type: "string"
                    description: "The agent's one-line summary of what it did"
                  candidates:
                    description: "On dryRun: the memories that would be forgotten"
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          description: "Memory ID"
                        memory:
                          type: "string"
                          description: "Memory content"
                        score:
                          type: "number"
                          description: "Similarity score against the forget query"
                      required:
                        - "id"
                        - "memory"
                        - "score"
                  forgotten:
                    description: "On apply: the memories that were forgotten"
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          description: "Memory ID"
                        memory:
                          type: "string"
                          description: "Memory content"
                        score:
                          type: "number"
                          description: "Similarity score against the forget query"
                      required:
                        - "id"
                        - "memory"
                        - "score"
                required:
                  - "dryRun"
                  - "count"
                  - "forgetBatchId"
                  - "summary"
                description: "Response after an agentic mass-forget"
          description: "Forget operation completed (or previewed)"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid request"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server error"
      summary: "Forget memories matching a prompt/query"
      tags:
        - "Content Management"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                query:
                  description: "Natural-language instruction ('forget everything about Project Titan') or a bare topic ('Project Titan'). The service searches the container's memories and selects matches to forget. Provide either query or ids."
                  example: "forget everything about Project Titan"
                  type: "string"
                  minLength: 1
                  maxLength: 2000
                ids:
                  description: "Forget exactly these memory ids, with no semantic search. Ids are validated against the containerTag, so unknown or out-of-scope ids are ignored. Provide either query or ids."
                  example:
                    - "abc123"
                    - "def456"
                  minItems: 1
                  maxItems: 500
                  type: "array"
                  items:
                    type: "string"
                containerTag:
                  type: "string"
                  maxLength: 100
                  pattern: "^[a-zA-Z0-9_:-]+$"
                  description: "Container tag / space the forget operation is scoped to."
                  example: "user_123"
                dryRun:
                  default: false
                  description: "When true, returns the memories that WOULD be forgotten without mutating anything. Defaults to false (forgets for real)."
                  example: false
                  type: "boolean"
                threshold:
                  default: 0.5
                  description: "Minimum cosine similarity a memory must have to be considered. Lower = wider net. Defaults to 0.5."
                  example: 0.5
                  type: "number"
                  minimum: 0
                  maximum: 1
                maxForget:
                  default: 100
                  description: "Maximum number of memories this call may forget. Defaults to 100, max 500."
                  example: 100
                  type: "integer"
                  minimum: 1
                  maximum: 500
                reason:
                  description: "Optional reason stored as forgetReason on each memory."
                  example: "project cancelled"
                  type: "string"
              required:
                - "containerTag"
      x-codeSamples:
        - lang: "bash"
          label: "cURL"
          source: "curl -X POST \"https://api.supermemory.ai/v4/memories/forget-matching\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"containerTag\": \"user_123\",\n    \"q\": \"outdated product preferences\"\n  }'"
      x-speakeasy-group: memories
      x-speakeasy-name-override: forgetMatching
  /v4/memories/list:
    post:
      operationId: "postV4MemoriesList"
      description: "List all latest memory entries from specified container tags with their update history and source documents"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  memoryEntries:
                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                          description: "Unique identifier for the memory entry"
                        memory:
                          type: "string"
                          description: "The memory content/text"
                        version:
                          type: "number"
                          description: "Version number of this memory"
                        isLatest:
                          type: "boolean"
                          description: "Whether this is the latest version"
                        isForgotten:
                          type: "boolean"
                          description: "Whether this memory has been forgotten"
                        isStatic:
                          type: "boolean"
                          description: "Whether this is a static profile memory"
                        isInference:
                          anyOf:
                            - type: "boolean"
                            - type: "null"
                          description: "Whether this is an inferred memory"
                        createdAt:
                          type: "string"
                          description: "ISO timestamp of creation"
                        updatedAt:
                          type: "string"
                          description: "ISO timestamp of last update"
                        spaceId:
                          type: "string"
                          description: "ID of the space this memory belongs to"
                        orgId:
                          type: "string"
                          description: "Organization ID"
                        sourceCount:
                          type: "number"
                          description: "Number of source documents for this memory"
                        parentMemoryId:
                          anyOf:
                            - type: "string"
                            - type: "null"
                          description: "ID of the parent memory (previous version)"
                        rootMemoryId:
                          anyOf:
                            - type: "string"
                            - type: "null"
                          description: "ID of the root memory (first version)"
                        forgetAfter:
                          anyOf:
                            - type: "string"
                            - type: "null"
                          description: "ISO timestamp when memory should be forgotten"
                        forgetReason:
                          anyOf:
                            - type: "string"
                            - type: "null"
                          description: "Reason for forgetting"
                        metadata:
                          anyOf:
                            - type: "object"
                              propertyNames:
                                type: "string"
                              additionalProperties: {}
                            - type: "null"
                          description: "Metadata including temporal context and other information"
                        memoryRelations:
                          anyOf:
                            - type: "object"
                              propertyNames:
                                type: "string"
                              additionalProperties:
                                type: "string"
                                enum:
                                  - "updates"
                                  - "extends"
                                  - "derives"
                            - type: "null"
                          description: "Relations to other memories"
                        temporalContext:
                          anyOf:
                            - type: "object"
                              propertyNames:
                                type: "string"
                              additionalProperties: {}
                            - type: "null"
                          description: "Temporal context metadata (alias for metadata field)"
                        history:
                          type: "array"
                          items:
                            type: "object"
                            properties:
                              id:
                                type: "string"
                              memory:
                                type: "string"
                              version:
                                type: "number"
                              createdAt:
                                type: "string"
                              updatedAt:
                                type: "string"
                              parentMemoryId:
                                anyOf:
                                  - type: "string"
                                  - type: "null"
                              rootMemoryId:
                                anyOf:
                                  - type: "string"
                                  - type: "null"
                              isLatest:
                                type: "boolean"
                              isForgotten:
                                type: "boolean"
                            required:
                              - "id"
                              - "memory"
                              - "version"
                              - "createdAt"
                              - "updatedAt"
                              - "parentMemoryId"
                              - "rootMemoryId"
                              - "isLatest"
                              - "isForgotten"
                            description: "Historical version of a memory entry"
                          description: "Previous versions of this memory"
                        documentIds:
                          type: "array"
                          items:
                            type: "string"
                          description: "IDs of source documents for this memory"
                      required:
                        - "id"
                        - "memory"
                        - "version"
                        - "isLatest"
                        - "isForgotten"
                        - "isStatic"
                        - "isInference"
                        - "createdAt"
                        - "updatedAt"
                        - "spaceId"
                        - "orgId"
                        - "sourceCount"
                        - "parentMemoryId"
                        - "rootMemoryId"
                        - "forgetAfter"
                        - "forgetReason"
                        - "metadata"
                        - "memoryRelations"
                        - "temporalContext"
                        - "history"
                        - "documentIds"
                      description: "Memory entry with history and document references"
                  pagination:
                    type: "object"
                    properties:
                      currentPage:
                        type: "number"
                      limit:
                        default: 10
                        type: "number"
                        maximum: 1100
                      totalItems:
                        type: "number"
                      totalPages:
                        type: "number"
                    required:
                      - "currentPage"
                      - "totalItems"
                      - "totalPages"
                    description: "Pagination metadata"
                    example:
                      currentPage: 1
                      limit: 10
                      totalItems: 100
                      totalPages: 10
                required:
                  - "memoryEntries"
                  - "pagination"
                description: "List of memory entries with their history and source documents"
          description: "Successfully retrieved memory entries"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Bad request - containerTags are required"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Internal server error"
      summary: "List memory entries with history"
      tags:
        - "Content Management"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                containerTags:
                  minItems: 1
                  type: "array"
                  items:
                    type: "string"
                    maxLength: 100
                    pattern: "^[a-zA-Z0-9_:-]+$"
                  description: "Container tags to filter memory entries. At least one tag is required."
                filters:
                  description: "Optional filters to apply to the search. Can be a JSON string or Query object."
                  $ref: "#/components/schemas/QueryFilter"
                limit:
                  description: "Number of items per page"
                  example: "10"
                  anyOf:
                    - type: "string"
                      pattern: "^\\d+$"
                    - type: "number"
                order:
                  default: "desc"
                  description: "Sort order"
                  example: "desc"
                  type: "string"
                  enum:
                    - "asc"
                    - "desc"
                page:
                  description: "Page number to fetch"
                  example: "1"
                  anyOf:
                    - type: "string"
                      pattern: "^\\d+$"
                    - type: "number"
                sort:
                  default: "createdAt"
                  description: "Field to sort by"
                  example: "createdAt"
                  type: "string"
                  enum:
                    - "createdAt"
                    - "updatedAt"
              required:
                - "containerTags"
              description: "Query parameters for listing memory entries with history"
      x-codeSamples:
        - lang: "bash"
          label: "cURL"
          source: "curl -X POST \"https://api.supermemory.ai/v4/memories/list\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{ \"containerTag\": \"user_123\", \"limit\": 20 }'"
      x-speakeasy-group: memories
      x-speakeasy-name-override: list
  /v4/profile:
    post:
      operationId: "postV4Profile"
      description: "Get user profile with optional search results"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  profile:
                    type: "object"
                    properties:
                      static:
                        description: "Static profile information that remains relevant long-term"
                        type: "array"
                        items:
                          type: "string"
                      dynamic:
                        description: "Dynamic profile information (recent memories)"
                        type: "array"
                        items:
                          type: "string"
                      buckets:
                        description: "Per-bucket memory lists, keyed by bucket key"
                        type: "object"
                        propertyNames:
                          type: "string"
                        additionalProperties:
                          type: "array"
                          items:
                            type: "string"
                  searchResults:
                    description: "Search results if a search query was provided"
                    type: "object"
                    properties:
                      results:
                        type: "array"
                        items:
                          type: "object"
                          properties:
                            id:
                              type: "string"
                              description: "Memory entry ID or chunk ID"
                              example: "mem_abc123"
                            memory:
                              description: "The memory content (only present for memory results)"
                              example: "The user prefers detailed API responses over minimal ones."
                              type: "string"
                            chunk:
                              description: "The chunk content (only present for chunk results from hybrid search)"
                              example: "This is a chunk of content from a document..."
                              type: "string"
                            metadata:
                              anyOf:
                                - type: "object"
                                  propertyNames:
                                    type: "string"
                                  additionalProperties: {}
                                - type: "null"
                              description: "Memory metadata"
                              example:
                                source: "conversation"
                                confidence: 0.9
                            updatedAt:
                              type: "string"
                              description: "Memory last update date"
                              format: "datetime"
                            similarity:
                              type: "number"
                              description: "Similarity score between the query and memory entry"
                              example: 0.89
                              maximum: 1
                              minimum: 0
                            filepath:
                              description: "Filepath of the source document this memory or chunk came from"
                              x-hidden: true
                              anyOf:
                                - type: "string"
                                - type: "null"
                            version:
                              description: "Version number of this memory entry"
                              example: 3
                              anyOf:
                                - type: "number"
                                - type: "null"
                            rootMemoryId:
                              description: "ID of the root (first version) memory entry this one descends from. Null for memories that have never been superseded. Only present on memory results, not on standalone chunk results."
                              example: "mem_abc123"
                              anyOf:
                                - type: "string"
                                - type: "null"
                            context:
                              description: "Object containing version history (parents/children via updates) and related memories (extends/derives)"
                              type: "object"
                              properties:
                                parents:
                                  type: "array"
                                  items:
                                    type: "object"
                                    properties:
                                      relation:
                                        type: "string"
                                        enum:
                                          - "updates"
                                          - "extends"
                                          - "derives"
                                        description: "Relation type between this memory and its parent/child"
                                        example: "updates"
                                      version:
                                        description: "Relative version distance from the primary memory (-1 for direct parent, -2 for grand-parent, etc.)"
                                        example: -1
                                        anyOf:
                                          - type: "number"
                                          - type: "null"
                                      memory:
                                        type: "string"
                                        description: "The contextual memory content"
                                        example: "Earlier version: API rate limit is 50 req/min on the free tier."
                                      metadata:
                                        description: "Contextual memory metadata"
                                        anyOf:
                                          - type: "object"
                                            propertyNames:
                                              type: "string"
                                            additionalProperties: {}
                                          - type: "null"
                                      updatedAt:
                                        type: "string"
                                        description: "Contextual memory last update date"
                                        format: "datetime"
                                    required:
                                      - "relation"
                                      - "memory"
                                      - "updatedAt"
                                children:
                                  type: "array"
                                  items:
                                    type: "object"
                                    properties:
                                      relation:
                                        type: "string"
                                        enum:
                                          - "updates"
                                          - "extends"
                                          - "derives"
                                        description: "Relation type between this memory and its parent/child"
                                        example: "extends"
                                      version:
                                        description: "Relative version distance from the primary memory (+1 for direct child, +2 for grand-child, etc.)"
                                        example: 1
                                        anyOf:
                                          - type: "number"
                                          - type: "null"
                                      memory:
                                        type: "string"
                                        description: "The contextual memory content"
                                        example: "Later version: API rate limit increased to 100 req/min on the free tier."
                                      metadata:
                                        description: "Contextual memory metadata"
                                        anyOf:
                                          - type: "object"
                                            propertyNames:
                                              type: "string"
                                            additionalProperties: {}
                                          - type: "null"
                                      updatedAt:
                                        type: "string"
                                        description: "Contextual memory last update date"
                                        format: "datetime"
                                    required:
                                      - "relation"
                                      - "memory"
                                      - "updatedAt"
                                related:
                                  type: "array"
                                  items:
                                    type: "object"
                                    properties:
                                      relation:
                                        type: "string"
                                        enum:
                                          - "extends"
                                          - "derives"
                                        description: "Relation type"
                                      memory:
                                        type: "string"
                                        description: "The related memory content"
                                      metadata:
                                        description: "Related memory metadata"
                                        anyOf:
                                          - type: "object"
                                            propertyNames:
                                              type: "string"
                                            additionalProperties: {}
                                          - type: "null"
                                      updatedAt:
                                        type: "string"
                                        description: "Related memory last update date"
                                    required:
                                      - "relation"
                                      - "memory"
                                      - "updatedAt"
                            documents:
