                    type: "array"
                    items:
                      type: "object"
                      properties:
                        id:
                          type: "string"
                        memory:
                          type: "string"
                        isStatic:
                          type: "boolean"
                        createdAt:
                          type: "string"
                        forgetAfter:
                          anyOf:
                            - type: "string"
                            - type: "null"
                          description: "ISO datetime when this memory expires"
                        forgetReason:
                          anyOf:
                            - type: "string"
                            - type: "null"
                          description: "Reason for scheduled forgetting"
                        metadata:
                          anyOf:
                            - type: "object"
                              propertyNames:
                                type: "string"
                              additionalProperties: {}
                            - type: "null"
                          description: "Arbitrary key-value metadata attached to this memory, or null if none was provided"
                      required:
                        - "id"
                        - "memory"
                        - "isStatic"
                        - "createdAt"
                        - "forgetAfter"
                        - "forgetReason"
                        - "metadata"
                required:
                  - "documentId"
                  - "memories"
                description: "Response after creating memories"
          description: "Memories created successfully"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid request"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Space not found for the given containerTag"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server error"
      summary: "Create memories directly"
      tags:
        - "Content Management"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                memories:
                  minItems: 1
                  maxItems: 100
                  type: "array"
                  items:
                    type: "object"
                    properties:
                      content:
                        type: "string"
                        minLength: 1
                        maxLength: 10000
                        description: "The memory text. Should be entity-centric, e.g. 'John prefers dark mode'."
                        example: "John prefers dark mode"
                      isStatic:
                        description: "Mark as true for permanent traits (name, profession, hometown). Defaults to false."
                        example: false
                        type: "boolean"
                      metadata:
                        description: "Arbitrary key-value metadata to attach."
                        type: "object"
                        propertyNames:
                          type: "string"
                        additionalProperties:
                          anyOf:
                            - type: "string"
                            - type: "number"
                            - type: "boolean"
                            - type: "array"
                              items:
                                type: "string"
                      forgetAfter:
                        description: "ISO 8601 datetime string. The memory will be auto-forgotten after this time. Pass null or omit for no expiry."
                        format: "datetime"
                        example: "2026-06-01T00:00:00Z"
                        anyOf:
                          - type: "string"
                          - type: "null"
                      forgetReason:
                        description: "Optional reason for the scheduled forgetting. Only meaningful when forgetAfter is set."
                        example: "temporary project deadline"
                        anyOf:
                          - type: "string"
                          - type: "null"
                      temporalContext:
                        description: "Structured temporal metadata. Merged into the metadata JSON column."
                        type: "object"
                        properties:
                          documentDate:
                            description: "Date the document was authored"
                            format: "datetime"
                            anyOf:
                              - type: "string"
                              - type: "null"
                          eventDate:
                            description: "Dates of events referenced in the memory"
                            anyOf:
                              - type: "array"
                                items:
                                  type: "string"
                              - type: "null"
                    required:
                      - "content"
                  description: "Array of memories to create"
                containerTag:
                  type: "string"
                  maxLength: 100
                  pattern: "^[a-zA-Z0-9_:-]+$"
                  description: "The space / container tag these memories belong to."
                  example: "user_123"
              required:
                - "memories"
