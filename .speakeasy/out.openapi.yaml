          label: "cURL"
          source: "curl -X POST \"https://api.supermemory.ai/v4/profile\" \\\n  -H \"Authorization: Bearer $SUPERMEMORY_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{ \"containerTag\": \"user_123\" }'"
      x-speakeasy-name-override: profile
