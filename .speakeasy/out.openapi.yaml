                                    type: "string"
                                  type:
                                    description: "Document type (only included when documents=true)"
                                    example: "web"
                                    type: "string"
                                  metadata:
                                    description: "Document metadata (only included when documents=true)"
                                    example:
                                      source: "upload"
                                      language: "en"
                                    anyOf:
                                      - type: "object"
                                        propertyNames:
                                          type: "string"
                                        additionalProperties: {}
                                      - type: "null"
                                  summary:
                                    description: "Document summary (only included when summaries=true)"
                                    example: "API rate limit policy: 100 req/min free, 1000 req/min pro."
                                    anyOf:
                                      - type: "string"
                                      - type: "null"
                                  createdAt:
                                    type: "string"
                                    description: "Document creation date"
                                    format: "datetime"
                                  updatedAt:
                                    type: "string"
                                    description: "Document last update date"
                                    format: "datetime"
                                required:
                                  - "id"
                                  - "createdAt"
                                  - "updatedAt"
                            chunks:
                              description: "Relevant chunks from associated documents (only included when chunks=true)"
                              type: "array"
                              items:
                                type: "object"
                                properties:
                                  content:
                                    type: "string"
                                    description: "Content of the chunk"
                                    example: "This is a chunk of content from the document..."
                                  position:
                                    type: "number"
                                    description: "Position of chunk in the document (0-indexed)"
                                    example: 0
                                  documentId:
                                    type: "string"
                                    description: "ID of the document this chunk belongs to"
                                    example: "doc_xyz789"
                                required:
                                  - "content"
                                  - "position"
                                  - "documentId"
                            isAggregated:
                              description: "Indicates if this memory was created by aggregating multiple source memories"
                              example: false
                              type: "boolean"
                          required:
                            - "id"
                            - "metadata"
                            - "updatedAt"
                            - "similarity"
                        description: "Search results for the provided query"
                      total:
                        type: "number"
                        description: "Total number of search results"
                      timing:
                        type: "number"
                        description: "Search timing in milliseconds"
                    required:
                      - "results"
                      - "total"
                      - "timing"
                required:
                  - "profile"
          description: "User profile with optional search results"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid request parameters"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unauthorized"
        "402":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Search quota or credits exhausted (when search query is provided)"
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Server error"
      summary: "Get user profile"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                q:
                  description: "Optional search query to include search results in the response"
                  type: "string"
                containerTag:
                  type: "string"
                  description: "Tag to filter the profile by. This can be an ID for your user, a project ID, or any other identifier you wish to use to filter memories."
                threshold:
                  description: "Threshold for search results. Only results with a score above this threshold will be included."
                  type: "number"
                  minimum: 0
                  maximum: 1
                filters:
                  description: "Optional metadata filters to apply to profile results and search results. Supports complex AND/OR queries with multiple conditions."
                  $ref: "#/components/schemas/QueryFilter"
                include:
                  description: "Profile sections to return. Omit to return all sections. Pass a subset to reduce payload — e.g. [\"buckets\"] skips static and dynamic entirely."
                  type: "array"
                  items:
                    type: "string"
                    enum:
                      - "static"
                      - "dynamic"
                      - "buckets"
                buckets:
                  description: "Specific bucket keys to return. Omit to return all configured buckets. Only relevant when \"buckets\" is included."
                  type: "array"
                  items:
                    type: "string"
              required:
                - "containerTag"
