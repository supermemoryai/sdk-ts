# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/supermemoryai/sdk-ts/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: The path to release, e.g. '.' or 'packages/mcp-server'. Leave empty to release all packages.
        required: false
      release_tag:
        description: The GitHub release tag to upload assets to when dispatched by another workflow.
        required: false

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Upgrade npm for trusted publishing support
        run: npm install -g npm@latest

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          yarn install

      - name: Publish to NPM
        run: |
          if [ -n "$INPUT_PATH" ]; then
            PATHS_RELEASED="[\"$INPUT_PATH\"]"
          else
            PATHS_RELEASED='[\".\", \"packages/mcp-server\"]'
          fi
          yarn tsn scripts/publish-packages.ts "{ \"paths_released\": $PATHS_RELEASED }"
        env:
          INPUT_PATH: ${{ github.event.inputs.path }}

      - name: Upload MCP Server DXT GitHub release asset
        if: github.event_name == 'release' || (github.event.inputs.release_tag != '' && github.event.inputs.path != '.')
        run: |
          gh release upload "$RELEASE_TAG" \
            packages/mcp-server/supermemory_api.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
